<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamber of Commerce Directory</title>
  <meta name="description" content="Business directory page for the local Chamber of Commerce.">
  <meta name="author" content="Erick Leonardo Scala García">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <!-- Facebook Open Graph Meta Tags -->
  <meta property="og:title" content="Chamber of Commerce Directory">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://guifabri.github.io/wdd231/chamber/images/vanguard-consulting.webp">
  <meta property="og:url" content="https://guifabri.github.io/wdd231/chamber/directory.html">
  <meta property="og:description" content="Discover local businesses and members in our Chamber of Commerce directory.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/larger.css" media="(min-width: 640px)">

  <!-- JavaScript Files -->
  <script src="scripts/navigation.js" defer></script>
  <script src="scripts/directory.js" defer></script>
</head>
<body>

  <header>
  <div class="header-top">
    <div class="brand">
      <img src="images/logo.svg" alt="Ureña Chamber of Commerce Logo">
      <span>Ureña Chamber of Commerce</span>
    </div>
    <button id="menuButton" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primaryNav">&#9776;</button>
  </div>
  <nav class="navigation" aria-label="Primary Navigation">
    <ul id="primaryNav">
      <li><a href="index.html">Home</a></li>
      <li><a href="discover.html">Discover</a></li>
      <li><a href="directory.html" class="active">Directory</a></li>
      <li><a href="join.html">Join</a></li>
    </ul>
  </nav>
</header>

  <main>
    <h1>Member Directory</h1>

    <!-- Botones para alternar vistas (Grid / Lista) -->
    <div class="views">
      <button id="grid" aria-label="Grid View">Grid</button>
      <button id="list" aria-label="List View">List</button>
    </div>

    <!-- Contenedor donde JS insertará los miembros -->
    <article id="members" class="grid"></article>
  </main>

  <footer>
    <div class="footer-info">
      <p><strong>Chamber of Commerce</strong></p>
      <p>123 Main Street, Cityville</p>
      <p>info@chamber.org | (123) 456-7890</p>
    </div>
    <div class="footer-dev">
      <p>&copy; <span id="currentyear"></span> | Erick Leonardo Scala García | WDD 231</p>
      <p id="lastModified"></p>
    </div>
  </footer>

</body>
</html>
